version: 2
updates:
  - package-ecosystem: github-actions
    # Outside the root, Dependabot reads the workflow files in the directory itself.
    directories: ["/", "/contributing/.github/workflows"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directory: /contributing
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
